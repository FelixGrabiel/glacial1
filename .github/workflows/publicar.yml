# GLACIAL · publicar la página en GitHub Pages con los archivos JS comprimidos (12/11/2026)
# En cada cambio en main: corre las pruebas rápidas, arma _sitio/ con scripts/construir-publicacion.js
# (cada archivo JS comprimido por separado, sin unirlos) y lo publica. Si una prueba falla, NO se publica
# y la página sigue con la versión anterior.
# Solo se publican index.html, js/, css/ y assets/ (ya no docs/, supabase/, tests/…).
# Requiere: Settings › Pages › Build and deployment › Source = «GitHub Actions».
name: Publicar página

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue2.outputs.page_url || steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # algunas pruebas comparan con commits antiguos
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Carga de scripts: archivos de index.html que existan, sobrescrituras dentro de la lista blanca y ?v= subido en todo js/css modificado.
      # Compara contra el estado anterior al push (github.event.before); si no existe (primer push, ejecución manual) usa el commit anterior.
      - name: Validar carga de scripts (orden, colisiones y ?v=)
        run: node scripts/validar-carga.js --base "${{ github.event.before }}"
      - name: Pruebas rápidas
        run: node tests/correr-todo.js
      - name: Instalar el compresor
        run: npm install --no-save --no-audit --no-fund terser@5.31.6
      - name: Armar el sitio
        run: node scripts/construir-publicacion.js _sitio
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _sitio
      # GitHub a veces no encuentra el archivo recién subido («Fetching artifact metadata failed») y la corrida queda con una X aunque el código esté bien.
      # Se espera un momento y, si aun así falla, se reintenta UNA vez. Si falla las dos veces, la corrida sí queda en rojo (falla real).
      - name: Esperar a que GitHub registre el archivo
        run: sleep 15
      - id: despliegue
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Esperar antes de reintentar
        if: steps.despliegue.outcome == 'failure'
        run: sleep 45
      - id: despliegue2
        if: steps.despliegue.outcome == 'failure'
        uses: actions/deploy-pages@v4
